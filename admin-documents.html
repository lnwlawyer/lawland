<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LawLand — จัดการเอกสาร</title><style>body{font:16px system-ui,sans-serif;background:#f3f6fa;color:#182338;margin:0;padding:20px}main{max-width:900px;margin:auto}section{background:white;border-radius:12px;padding:20px;margin:16px 0}label{display:block;margin:12px 0 4px}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #a9b2c0;border-radius:6px}button{padding:10px 14px;margin:6px 6px 6px 0;border:0;border-radius:6px;background:#1656a7;color:white;cursor:pointer}button:disabled{opacity:.5}article{border-top:1px solid #ddd;padding:12px 0}.muted{color:#5a6576}</style></head><body><main><h1>จัดการเอกสาร — LawLand</h1><p>เอกสารในหน้านี้จัดเก็บใน Firebase ใหม่ ไม่แก้ไขเอกสาร Google Sheets เดิม</p><a href="./index.html">กลับหน้าหลัก</a> · <a href="./admin-menus.html">จัดการเมนู</a><p id="status" role="status">กำลังตรวจสอบสิทธิ์…</p><section id="workspace" hidden><h2>เพิ่ม / แก้ไขเอกสาร</h2><form id="editor"><input type="hidden" id="docId"><input type="hidden" id="docVersion"><label for="title">ชื่อเอกสาร</label><input id="title" required maxlength="180"><label for="mainMenu">เมนูหลัก (จากรายการจริง)</label><select id="mainMenu" required><option value="">กำลังโหลดเมนู…</option></select><label for="category">หมวดหมู่ย่อย</label><select id="category" required><option value="">เลือกเมนูหลักก่อน</option></select><p id="menuLoadStatus" class="muted" role="status"></p><label for="url">ลิงก์เอกสาร HTTPS</label><input id="url" required type="url" maxlength="1500" placeholder="https://..."><label for="description">คำอธิบาย</label><textarea id="description" required maxlength="2000" rows="4"></textarea><button type="submit" id="save">บันทึกฉบับร่าง</button><button type="button" id="publish">เผยแพร่เอกสาร</button><button type="button" id="reset">เริ่มรายการใหม่</button><button type="button" id="reloadSelected" hidden>โหลดฉบับล่าสุด (แทนที่ข้อความในแบบฟอร์ม)</button></form></section><section id="inventory" hidden><h2>เอกสาร Firebase</h2><p class="muted">แก้ไขได้เฉพาะเอกสารในฐานข้อมูลใหม่ รายการ Google Sheets เดิมไม่ถูกเปลี่ยน</p><label for="statusFilter">สถานะเอกสาร</label><select id="statusFilter"><option value="all">ทุกสถานะ</option><option value="published">เผยแพร่แล้ว</option><option value="draft">ฉบับร่าง</option><option value="trashed">ถังขยะ</option></select><label for="adminSearch">ค้นหาชื่อเอกสารหรือหมวดหมู่ (เฉพาะข้อมูลที่โหลดแล้ว)</label><input id="adminSearch" type="search" maxlength="120" placeholder="พิมพ์คำค้น"><p id="inventoryCount" role="status"></p><div id="list"></div><button id="previousAdminPage" type="button" disabled>หน้าก่อนหน้า</button><button id="nextAdminPage" type="button" disabled>หน้าถัดไป</button><button id="loadMoreAdmin" type="button" hidden>โหลดรายการเพิ่มเติม</button></section></main><script type="module">
import {filterAdminDocuments,paginateAdminDocuments} from './admin-catalog.mjs';
import {mergeMenuCatalog} from './menu-catalog.mjs';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
import {getFirestore,collection,doc,getDoc,getDocs,query,limit,startAfter,runTransaction,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyD47rhbngXw3LXIsYa97OsKpuBA28c7faw',authDomain:'land-law-ea2bb.firebaseapp.com',projectId:'land-law-ea2bb',appId:'1:857909535391:web:d6bc0679725d5f557a38aa'});
const auth=getAuth(app),db=getFirestore(app),status=document.getElementById('status'),workspace=document.getElementById('workspace'),inventory=document.getElementById('inventory'),form=document.getElementById('editor');
let authorizedUid=null,records=[],lastDocument=null,allLoaded=false,inventoryBusy=false,adminPage=0,inventoryGeneration=0,inventoryRequest=0,searchTimer=null,authVerificationGeneration=0;
const ADMIN_FETCH_SIZE=50,ADMIN_PAGE_SIZE=20;
const MENU_API='https://script.google.com/macros/s/AKfycbwG82PSvIQjy7Ujmab4btojXbgHp2ECYJ9Lm4G49rwnSQS-7I4TbQ-tAB9UCi5zKUsZ/exec';
let menuParents=[],menuChildren=[],menuGeneration=0;
async function fetchMenuSheet(sheet){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
 try{const url=new URL(MENU_API);url.searchParams.set('sheetName',sheet);
 const response=await fetch(url,{signal:controller.signal});if(!response.ok)throw Error('menu-request-failed');
 const result=await response.json();if(!result||result.success!==true||!Array.isArray(result.data))throw Error('invalid-menu-response');
 return result.data;}finally{clearTimeout(timer)}
}
function setMenuOptions(select,items,valueKey,titleKey,placeholder){
 select.replaceChildren();const first=document.createElement('option');first.value='';first.textContent=placeholder;select.append(first);
 for(const item of items){const option=document.createElement('option');option.value=item[valueKey];option.textContent=item[titleKey];select.append(option)}
}
function selectCategory(category){
 const child=menuChildren.find(x=>x.subMenuId===category);
 const parent=child&&menuParents.find(x=>x.menuId===child.parentMenuId);
 field('mainMenu').value=parent?parent.menuId:'';
 updateSubMenuOptions(category);
}
function updateSubMenuOptions(selected=''){
 const parent=field('mainMenu').value;
 setMenuOptions(field('category'),menuChildren.filter(x=>x.parentMenuId===parent),'subMenuId','subMenuTitle','เลือกหมวดหมู่ย่อย');
 field('category').value=selected&&menuChildren.some(x=>x.parentMenuId===parent&&x.subMenuId===selected)?selected:'';
}
async function loadRealMenus(){
 const generation=++menuGeneration;
 try{
  const [parents,children]=await Promise.all([fetchMenuSheet('MainMenu'),fetchMenuSheet('SubMenu')]);
  if(generation!==menuGeneration)return;
  let overlays=[];
  if(auth.currentUser){try{const snapshot=await getDocs(collection(db,'menuOverrides'));if(generation!==menuGeneration)return;overlays=snapshot.docs.map(x=>({id:x.id,...x.data()}))}catch(e){field('menuLoadStatus').textContent='ยังโหลดเมนู Firebase ไม่ได้ ใช้เมนูเดิมชั่วคราว'}}
  const merged=mergeMenuCatalog(parents,children,overlays);
  menuParents=merged.mainMenus.filter(x=>x&&typeof x.menuId==='string'&&typeof x.menuTitle==='string'&&x.menuId!=='settings'&&x.menuId!=='about');
  menuChildren=merged.subMenus.filter(x=>x&&typeof x.subMenuId==='string'&&x.subMenuId.length<=100&&typeof x.parentMenuId==='string'&&typeof x.subMenuTitle==='string'&&menuParents.some(p=>p.menuId===x.parentMenuId));
  setMenuOptions(field('mainMenu'),menuParents.filter(x=>menuChildren.some(c=>c.parentMenuId===x.menuId)),'menuId','menuTitle','เลือกเมนูหลัก');
  updateSubMenuOptions();field('menuLoadStatus').textContent='เลือกหมวดหมู่จากรายการจริงของ LawLand';
 }catch(e){if(generation===menuGeneration){field('menuLoadStatus').textContent='โหลดหมวดหมู่ไม่สำเร็จ กรุณารีเฟรชหน้าแล้วลองอีกครั้ง';status.textContent='ไม่สามารถโหลดเมนูจริงได้';}}
}
field('mainMenu').addEventListener('change',()=>updateSubMenuOptions());
void loadRealMenus();

const field=id=>document.getElementById(id);
const clean=()=>{form.reset();updateSubMenuOptions();field('docId').value='';field('docVersion').value='';field('reloadSelected').hidden=true;};
const data=()=>({title:field('title').value.trim(),category:field('category').value.trim(),url:field('url').value.trim(),description:field('description').value.trim()});
const valid=d=>d.title.length>0&&d.title.length<=180&&d.category.length>0&&d.category.length<=100&&d.description.length>0&&d.description.length<=2000&&d.url.length<=1500&&/^https:\/\//i.test(d.url);
function renderInventory(){
 const list=field('list'),term=field('adminSearch').value.trim().toLocaleLowerCase('th'),chosen=field('statusFilter').value;
 const filtered=filterAdminDocuments(records,chosen,term);
 const pagination=paginateAdminDocuments(filtered,adminPage,ADMIN_PAGE_SIZE);adminPage=pagination.page;
 const pages=pagination.pages;
 list.replaceChildren();
 for(const entry of pagination.items){
  const article=document.createElement('article'),label=document.createElement('strong');
  label.textContent=String(entry.title||'ไม่มีชื่อเอกสาร')+' — '+(entry.status==='published'?'เผยแพร่แล้ว':entry.status==='trashed'?'ถังขยะ':'ฉบับร่าง');
  article.append(label);
  if(entry.status!=='trashed'){
   const edit=document.createElement('button');edit.type='button';edit.textContent='แก้ไข';
   edit.addEventListener('click',()=>{field('docId').value=entry.id;field('docVersion').value=String(entry.version);field('reloadSelected').hidden=false;for(const key of ['title','url','description'])field(key).value=entry[key]||'';selectCategory(entry.category);window.scrollTo(0,0)});
   article.append(edit);
  }
  for(const [action,caption] of (entry.status==='trashed'?[['restore','กู้คืนเป็นฉบับร่าง'],['delete','ลบถาวร']]:[['unpublish','ยกเลิกเผยแพร่'],['trash','ย้ายไปถังขยะ']])){
   if(action==='unpublish'&&entry.status!=='published')continue;
   const button=document.createElement('button');button.type='button';button.textContent=caption;
   button.addEventListener('click',()=>void changeLifecycle(entry,action));article.append(button);
  }
  list.append(article);
 }
 field('inventoryCount').textContent='พบ '+filtered.length+' รายการจากที่โหลดแล้ว '+records.length+' รายการ · หน้า '+(adminPage+1)+'/'+pages+(allLoaded?' · โหลดครบแล้ว':' · ยังมีรายการที่ไม่ได้โหลด');
 field('previousAdminPage').disabled=adminPage===0;
 field('nextAdminPage').disabled=adminPage>=pages-1;
 field('loadMoreAdmin').hidden=allLoaded;
 field('loadMoreAdmin').disabled=inventoryBusy;
}
async function loadAdminBatch(){
 if(!authorizedUid||auth.currentUser?.uid!==authorizedUid||inventoryBusy||allLoaded)return;
 const session=authorizedUid,generation=inventoryGeneration,request=++inventoryRequest;
 inventoryBusy=true;field('loadMoreAdmin').disabled=true;
 try{
  const constraints=[limit(ADMIN_FETCH_SIZE)];
  if(lastDocument)constraints.push(startAfter(lastDocument));
  const snap=await getDocs(query(collection(db,'managedDocuments'),...constraints));
  if(auth.currentUser?.uid!==session||authorizedUid!==session||generation!==inventoryGeneration)return;
  records.push(...snap.docs.map(x=>{const data=x.data();return {id:x.id,...data,searchText:(String(data.title||'')+' '+String(data.category||'')).toLocaleLowerCase('th')}}));
  if(!snap.empty)lastDocument=snap.docs[snap.docs.length-1];
  allLoaded=snap.size<ADMIN_FETCH_SIZE;
 }catch(e){if(authorizedUid===session&&generation===inventoryGeneration)status.textContent='โหลดรายการไม่สำเร็จ: '+(e.code||e.message||'unknown')}
 finally{if(request===inventoryRequest){inventoryBusy=false;if(authorizedUid===session&&generation===inventoryGeneration)renderInventory()}}
}
async function refresh(){
 if(!authorizedUid||auth.currentUser?.uid!==authorizedUid)return;
 inventoryGeneration++;inventoryRequest++;inventoryBusy=false;records=[];lastDocument=null;allLoaded=false;adminPage=0;
 renderInventory();await loadAdminBatch();
}
async function changeLifecycle(entry,action){
 const actor=auth.currentUser;
 if(!authorizedUid||!actor||actor.uid!==authorizedUid)return;
 const message={unpublish:'ยกเลิกเผยแพร่เอกสารนี้?',trash:'ย้ายเอกสารนี้ไปถังขยะ?',restore:'กู้คืนเอกสารนี้เป็นฉบับร่าง?',delete:'ลบเอกสารนี้ถาวร? การดำเนินการนี้ไม่สามารถย้อนกลับได้'}[action];
 if(!message||!window.confirm(message))return;
 if(action==='delete'&&window.prompt('พิมพ์คำว่า ลบถาวร เพื่อยืนยัน')!=='ลบถาวร')return;
 status.textContent='กำลังดำเนินการ…';
 try{
  const token=await actor.getIdTokenResult(true);
  if(token.claims.admin!==true||auth.currentUser?.uid!==authorizedUid)throw Error('permission-denied');
  const ref=doc(db,'managedDocuments',entry.id);
  await runTransaction(db,async tx=>{
   const snap=await tx.get(ref);
   if(!snap.exists()||snap.data().version!==entry.version||snap.data().status!==entry.status)throw Error('stale-document');
   const previous=snap.data();
   const target=action==='unpublish'?'draft':action==='trash'?'trashed':action==='restore'?'draft':null;
   if(action==='delete'){
    if(previous.status!=='trashed')throw Error('must-trash-first');
    tx.delete(ref);
   }else{
    if((action==='unpublish'&&previous.status!=='published')||(action==='restore'&&previous.status!=='trashed')||(action==='trash'&&previous.status==='trashed'))throw Error('invalid-transition');
    tx.update(ref,{status:target,version:previous.version+1,updatedBy:actor.uid,updatedAt:serverTimestamp()});
   }
  });
  status.textContent='ดำเนินการสำเร็จ';clean();await refresh();
 }catch(e){status.textContent='ไม่สามารถดำเนินการได้: '+(e.code||e.message||'unknown')}
}
async function write(publish){const actor=auth.currentUser;if(!authorizedUid||!actor||actor.uid!==authorizedUid)return;const d=data();if(!valid(d)||!menuChildren.some(x=>x.subMenuId===d.category&&x.parentMenuId===field('mainMenu').value)){status.textContent='กรุณาเลือกเมนูหลักและหมวดหมู่ย่อยจากรายการจริง พร้อมกรอกลิงก์ HTTPS';return}const editing=Boolean(field('docId').value),expectedVersion=Number(field('docVersion').value),id=field('docId').value||doc(collection(db,'managedDocuments')).id;status.textContent='กำลังตรวจสอบสิทธิ์และบันทึก…';field('save').disabled=field('publish').disabled=true;try{const token=await actor.getIdTokenResult(true);if(token.claims.admin!==true||auth.currentUser?.uid!==authorizedUid)throw Error('permission-denied');await runTransaction(db,async tx=>{const ref=doc(db,'managedDocuments',id),old=await tx.get(ref),version=old.exists()?old.data().version+1:1;if(editing&&(!old.exists()||old.data().version!==expectedVersion))throw Error('stale-document-reload-required');if(!editing&&old.exists())throw Error('document-id-collision');if(old.exists()&&old.data().status==='trashed')throw Error('restore-before-edit');tx.set(ref,{...d,status:publish?'published':old.exists()&&old.data().status==='published'?'published':'draft',version,updatedBy:actor.uid,updatedAt:serverTimestamp()})});status.textContent=publish?'เผยแพร่เอกสารสำเร็จ':'บันทึกสำเร็จ';clean();await refresh()}catch(e){status.textContent=(e.message==='stale-document-reload-required'?'เอกสารมีการแก้ไขจากที่อื่นแล้ว ข้อมูลที่พิมพ์ยังอยู่ในแบบฟอร์ม โปรดตรวจสอบก่อนกดโหลดฉบับล่าสุด':'ไม่สามารถบันทึกได้: '+(e.code||e.message||'unknown')+' ตรวจสอบ Firestore Rules')}finally{field('save').disabled=field('publish').disabled=false}}
onAuthStateChanged(auth,async user=>{const verification=++authVerificationGeneration;authorizedUid=null;clean();field('list').replaceChildren();field('inventoryCount').textContent='';field('adminSearch').value='';field('statusFilter').value='all';if(searchTimer!==null){clearTimeout(searchTimer);searchTimer=null}inventoryGeneration++;inventoryRequest++;inventoryBusy=false;records=[];lastDocument=null;allLoaded=false;adminPage=0;workspace.hidden=inventory.hidden=true;if(!user){status.textContent='กรุณาเข้าสู่ระบบ Google ที่หน้าหลักก่อน';return}try{const token=await user.getIdTokenResult(true);if(verification!==authVerificationGeneration||auth.currentUser?.uid!==user.uid)return;if(token.claims.admin!==true){status.textContent='บัญชีนี้ไม่มีสิทธิ์ Admin';return}authorizedUid=user.uid;workspace.hidden=inventory.hidden=false;status.textContent='ยืนยันสิทธิ์ Admin แล้ว';await refresh()}catch(e){if(verification===authVerificationGeneration)status.textContent='ตรวจสอบสิทธิ์หรือโหลดรายการไม่สำเร็จ: '+(e.code||'unknown')}});
form.addEventListener('submit',e=>{e.preventDefault();void write(false)});field('publish').addEventListener('click',()=>void write(true));field('reset').addEventListener('click',clean);
field('reloadSelected').addEventListener('click',async()=>{const actor=auth.currentUser,id=field('docId').value,uid=authorizedUid;if(!actor||actor.uid!==uid||!id)return;if(!window.confirm('โหลดฉบับล่าสุดจากฐานข้อมูล? ข้อความที่แก้ไขค้างอยู่ในแบบฟอร์มจะถูกแทนที่'))return;try{const token=await actor.getIdTokenResult(true);if(token.claims.admin!==true||auth.currentUser?.uid!==uid)throw Error('permission-denied');const snap=await getDoc(doc(db,'managedDocuments',id));if(auth.currentUser?.uid!==uid||field('docId').value!==id)return;if(!snap.exists()||snap.data().status==='trashed'){status.textContent='เอกสารถูกลบหรือย้ายไปถังขยะแล้ว';return}const latest=snap.data();for(const key of ['title','url','description'])field(key).value=latest[key]||'';selectCategory(latest.category);field('docVersion').value=String(latest.version);status.textContent='โหลดฉบับล่าสุดแล้ว';}catch(e){status.textContent='โหลดฉบับล่าสุดไม่สำเร็จ: '+(e.code||e.message||'unknown')}});
field('statusFilter').addEventListener('change',()=>{adminPage=0;renderInventory()});
field('adminSearch').addEventListener('input',()=>{if(searchTimer!==null)clearTimeout(searchTimer);searchTimer=setTimeout(()=>{searchTimer=null;adminPage=0;renderInventory()},180)});
field('previousAdminPage').addEventListener('click',()=>{if(adminPage>0){adminPage--;renderInventory()}});
field('nextAdminPage').addEventListener('click',()=>{adminPage++;renderInventory()});
field('loadMoreAdmin').addEventListener('click',()=>void loadAdminBatch());
</script></body></html>
