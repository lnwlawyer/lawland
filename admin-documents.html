<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LawLand — จัดการเอกสาร</title><style>body{font:16px system-ui,sans-serif;background:#f3f6fa;color:#182338;margin:0;padding:20px}main{max-width:900px;margin:auto}section{background:white;border-radius:12px;padding:20px;margin:16px 0}label{display:block;margin:12px 0 4px}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #a9b2c0;border-radius:6px}button{padding:10px 14px;margin:6px 6px 6px 0;border:0;border-radius:6px;background:#1656a7;color:white;cursor:pointer}button:disabled{opacity:.5}article{border-top:1px solid #ddd;padding:12px 0}.muted{color:#5a6576}</style></head><body><main><h1>จัดการเอกสาร — LawLand</h1><p>เอกสารในหน้านี้จัดเก็บใน Firebase ใหม่ ไม่แก้ไขเอกสาร Google Sheets เดิม</p><a href="./index.html">กลับหน้าหลัก</a> · <a href="./published-documents.html">เอกสารที่เผยแพร่แล้ว</a><p id="status" role="status">กำลังตรวจสอบสิทธิ์…</p><section id="workspace" hidden><h2>เพิ่ม / แก้ไขเอกสาร</h2><form id="editor"><input type="hidden" id="docId"><label for="title">ชื่อเอกสาร</label><input id="title" required maxlength="180"><label for="category">หมวดหมู่</label><input id="category" required maxlength="100"><label for="url">ลิงก์เอกสาร HTTPS</label><input id="url" required type="url" maxlength="1500" placeholder="https://..."><label for="description">คำอธิบาย</label><textarea id="description" required maxlength="2000" rows="4"></textarea><button type="submit" id="save">บันทึกฉบับร่าง</button><button type="button" id="publish">เผยแพร่เอกสาร</button><button type="button" id="reset">เริ่มรายการใหม่</button></form></section><section id="inventory" hidden><h2>เอกสาร Firebase</h2><p class="muted">แก้ไขได้เฉพาะเอกสารในฐานข้อมูลใหม่ รายการ Google Sheets เดิมไม่ถูกเปลี่ยน</p><label for="statusFilter">สถานะเอกสาร</label><select id="statusFilter"><option value="all">ทุกสถานะ</option><option value="published">เผยแพร่แล้ว</option><option value="draft">ฉบับร่าง</option><option value="trashed">ถังขยะ</option></select><label for="adminSearch">ค้นหาชื่อเอกสารหรือหมวดหมู่ (เฉพาะข้อมูลที่โหลดแล้ว)</label><input id="adminSearch" type="search" maxlength="120" placeholder="พิมพ์คำค้น"><p id="inventoryCount" role="status"></p><div id="list"></div><button id="previousAdminPage" type="button" disabled>หน้าก่อนหน้า</button><button id="nextAdminPage" type="button" disabled>หน้าถัดไป</button><button id="loadMoreAdmin" type="button" hidden>โหลดรายการเพิ่มเติม</button></section></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
import {getFirestore,collection,doc,getDocs,query,limit,startAfter,runTransaction,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyD47rhbngXw3LXIsYa97OsKpuBA28c7faw',authDomain:'land-law-ea2bb.firebaseapp.com',projectId:'land-law-ea2bb',appId:'1:857909535391:web:d6bc0679725d5f557a38aa'});
const auth=getAuth(app),db=getFirestore(app),status=document.getElementById('status'),workspace=document.getElementById('workspace'),inventory=document.getElementById('inventory'),form=document.getElementById('editor');
let authorizedUid=null,records=[],lastDocument=null,allLoaded=false,inventoryBusy=false,adminPage=0,inventoryGeneration=0,inventoryRequest=0,searchTimer=null;
const ADMIN_FETCH_SIZE=50,ADMIN_PAGE_SIZE=20;
const field=id=>document.getElementById(id);
const clean=()=>{form.reset();field('docId').value='';};
const data=()=>({title:field('title').value.trim(),category:field('category').value.trim(),url:field('url').value.trim(),description:field('description').value.trim()});
const valid=d=>d.title.length>0&&d.title.length<=180&&d.category.length>0&&d.category.length<=100&&d.description.length>0&&d.description.length<=2000&&d.url.length<=1500&&/^https:\/\//i.test(d.url);
function renderInventory(){
 const list=field('list'),term=field('adminSearch').value.trim().toLocaleLowerCase('th'),chosen=field('statusFilter').value;
 const filtered=records.filter(entry=>(chosen==='all'||entry.status===chosen)&&entry.searchText.includes(term));
 const pages=Math.max(1,Math.ceil(filtered.length/ADMIN_PAGE_SIZE));adminPage=Math.min(adminPage,pages-1);
 list.replaceChildren();
 for(const entry of filtered.slice(adminPage*ADMIN_PAGE_SIZE,(adminPage+1)*ADMIN_PAGE_SIZE)){
  const article=document.createElement('article'),label=document.createElement('strong');
  label.textContent=String(entry.title||'ไม่มีชื่อเอกสาร')+' — '+(entry.status==='published'?'เผยแพร่แล้ว':entry.status==='trashed'?'ถังขยะ':'ฉบับร่าง');
  article.append(label);
  if(entry.status!=='trashed'){
   const edit=document.createElement('button');edit.type='button';edit.textContent='แก้ไข';
   edit.addEventListener('click',()=>{field('docId').value=entry.id;for(const key of ['title','category','url','description'])field(key).value=entry[key]||'';window.scrollTo(0,0)});
   article.append(edit);
  }
  for(const [action,caption] of (entry.status==='trashed'?[['restore','กู้คืนเป็นฉบับร่าง'],['delete','ลบถาวร']]:[['unpublish','ยกเลิกเผยแพร่'],['trash','ย้ายไปถังขยะ']])){
   if(action==='unpublish'&&entry.status!=='published')continue;
   const button=document.createElement('button');button.type='button';button.textContent=caption;
   button.addEventListener('click',()=>void changeLifecycle(entry,action));article.append(button);
  }
  list.append(article);
 }
 field('inventoryCount').textContent='พบ '+filtered.length+' รายการจากที่โหลดแล้ว '+records.length+' รายการ · หน้า '+(adminPage+1)+'/'+pages+(allLoaded?' · โหลดครบแล้ว':' · ยังมีรายการที่ไม่ได้โหลด');
 field('previousAdminPage').disabled=adminPage===0;
 field('nextAdminPage').disabled=adminPage>=pages-1;
 field('loadMoreAdmin').hidden=allLoaded;
 field('loadMoreAdmin').disabled=inventoryBusy;
}
async function loadAdminBatch(){
 if(!authorizedUid||auth.currentUser?.uid!==authorizedUid||inventoryBusy||allLoaded)return;
 const session=authorizedUid,generation=inventoryGeneration,request=++inventoryRequest;
 inventoryBusy=true;field('loadMoreAdmin').disabled=true;
 try{
  const constraints=[limit(ADMIN_FETCH_SIZE)];
  if(lastDocument)constraints.push(startAfter(lastDocument));
  const snap=await getDocs(query(collection(db,'managedDocuments'),...constraints));
  if(auth.currentUser?.uid!==session||authorizedUid!==session||generation!==inventoryGeneration)return;
  records.push(...snap.docs.map(x=>{const data=x.data();return {id:x.id,...data,searchText:(String(data.title||'')+' '+String(data.category||'')).toLocaleLowerCase('th')}}));
  if(!snap.empty)lastDocument=snap.docs[snap.docs.length-1];
  allLoaded=snap.size<ADMIN_FETCH_SIZE;
 }catch(e){if(authorizedUid===session&&generation===inventoryGeneration)status.textContent='โหลดรายการไม่สำเร็จ: '+(e.code||e.message||'unknown')}
 finally{if(request===inventoryRequest){inventoryBusy=false;if(authorizedUid===session&&generation===inventoryGeneration)renderInventory()}}
}
async function refresh(){
 if(!authorizedUid||auth.currentUser?.uid!==authorizedUid)return;
 inventoryGeneration++;inventoryRequest++;inventoryBusy=false;records=[];lastDocument=null;allLoaded=false;adminPage=0;
 renderInventory();await loadAdminBatch();
}
async function changeLifecycle(entry,action){
 const actor=auth.currentUser;
 if(!authorizedUid||!actor||actor.uid!==authorizedUid)return;
 const message={unpublish:'ยกเลิกเผยแพร่เอกสารนี้?',trash:'ย้ายเอกสารนี้ไปถังขยะ?',restore:'กู้คืนเอกสารนี้เป็นฉบับร่าง?',delete:'ลบเอกสารนี้ถาวร? การดำเนินการนี้ไม่สามารถย้อนกลับได้'}[action];
 if(!message||!window.confirm(message))return;
 if(action==='delete'&&window.prompt('พิมพ์คำว่า ลบถาวร เพื่อยืนยัน')!=='ลบถาวร')return;
 status.textContent='กำลังดำเนินการ…';
 try{
  const token=await actor.getIdTokenResult(true);
  if(token.claims.admin!==true||auth.currentUser?.uid!==authorizedUid)throw Error('permission-denied');
  const ref=doc(db,'managedDocuments',entry.id);
  await runTransaction(db,async tx=>{
   const snap=await tx.get(ref);
   if(!snap.exists()||snap.data().version!==entry.version||snap.data().status!==entry.status)throw Error('stale-document');
   const previous=snap.data();
   const target=action==='unpublish'?'draft':action==='trash'?'trashed':action==='restore'?'draft':null;
   if(action==='delete'){
    if(previous.status!=='trashed')throw Error('must-trash-first');
    tx.delete(ref);
   }else{
    if((action==='unpublish'&&previous.status!=='published')||(action==='restore'&&previous.status!=='trashed')||(action==='trash'&&previous.status==='trashed'))throw Error('invalid-transition');
    tx.update(ref,{status:target,version:previous.version+1,updatedBy:actor.uid,updatedAt:serverTimestamp()});
   }
  });
  status.textContent='ดำเนินการสำเร็จ';clean();await refresh();
 }catch(e){status.textContent='ไม่สามารถดำเนินการได้: '+(e.code||e.message||'unknown')}
}
async function write(publish){const actor=auth.currentUser;if(!authorizedUid||!actor||actor.uid!==authorizedUid)return;const d=data();if(!valid(d)){status.textContent='กรุณากรอกข้อมูลให้ครบ และใช้ลิงก์ HTTPS';return}const id=field('docId').value||doc(collection(db,'managedDocuments')).id;status.textContent='กำลังตรวจสอบสิทธิ์และบันทึก…';field('save').disabled=field('publish').disabled=true;try{const token=await actor.getIdTokenResult(true);if(token.claims.admin!==true||auth.currentUser?.uid!==authorizedUid)throw Error('permission-denied');await runTransaction(db,async tx=>{const ref=doc(db,'managedDocuments',id),old=await tx.get(ref),version=old.exists()?old.data().version+1:1;if(old.exists()&&old.data().status==='trashed')throw Error('restore-before-edit');tx.set(ref,{...d,status:publish?'published':old.exists()&&old.data().status==='published'?'published':'draft',version,updatedBy:actor.uid,updatedAt:serverTimestamp()})});status.textContent=publish?'เผยแพร่เอกสารสำเร็จ':'บันทึกสำเร็จ';clean();await refresh()}catch(e){status.textContent='ไม่สามารถบันทึกได้: '+(e.code||e.message||'unknown')+' ตรวจสอบ Firestore Rules'}finally{field('save').disabled=field('publish').disabled=false}}
onAuthStateChanged(auth,async user=>{authorizedUid=null;inventoryGeneration++;inventoryRequest++;inventoryBusy=false;records=[];lastDocument=null;allLoaded=false;adminPage=0;workspace.hidden=inventory.hidden=true;if(!user){status.textContent='กรุณาเข้าสู่ระบบ Google ที่หน้าหลักก่อน';return}try{const token=await user.getIdTokenResult(true);if(auth.currentUser?.uid!==user.uid)return;if(token.claims.admin!==true){status.textContent='บัญชีนี้ไม่มีสิทธิ์ Admin';return}authorizedUid=user.uid;workspace.hidden=inventory.hidden=false;status.textContent='ยืนยันสิทธิ์ Admin แล้ว';await refresh()}catch(e){status.textContent='ตรวจสอบสิทธิ์หรือโหลดรายการไม่สำเร็จ: '+(e.code||'unknown')}});
form.addEventListener('submit',e=>{e.preventDefault();void write(false)});field('publish').addEventListener('click',()=>void write(true));field('reset').addEventListener('click',clean);
field('statusFilter').addEventListener('change',()=>{adminPage=0;renderInventory()});
field('adminSearch').addEventListener('input',()=>{if(searchTimer!==null)clearTimeout(searchTimer);searchTimer=setTimeout(()=>{searchTimer=null;adminPage=0;renderInventory()},180)});
field('previousAdminPage').addEventListener('click',()=>{if(adminPage>0){adminPage--;renderInventory()}});
field('nextAdminPage').addEventListener('click',()=>{adminPage++;renderInventory()});
field('loadMoreAdmin').addEventListener('click',()=>void loadAdminBatch());
</script></body></html>
