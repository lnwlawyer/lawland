name: Lawland Firestore Rules Emulator
on:
  pull_request:
    paths:
      - 'firestore/lawland.rules'
      - 'firebase.emulator.json'
      - 'emulator-tests/**'
      - 'package.json'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm run test:rules
