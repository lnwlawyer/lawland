<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LawLand — เอกสารเผยแพร่</title><style>body{font:16px system-ui,sans-serif;background:#f3f6fa;color:#182338;padding:20px}main{max-width:800px;margin:auto}article{background:white;padding:16px;margin:12px 0;border-radius:10px}a{color:#1253a3}</style></head><body><main><h1>เอกสารเผยแพร่ — LawLand</h1><p><a href="./index.html">กลับหน้าหลัก</a></p><p id="status" role="status">กำลังโหลดเอกสาร…</p><div id="list"></div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
import {getFirestore,collection,query,where,limit,getDocs} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyD47rhbngXw3LXIsYa97OsKpuBA28c7faw',authDomain:'land-law-ea2bb.firebaseapp.com',projectId:'land-law-ea2bb',appId:'1:857909535391:web:d6bc0679725d5f557a38aa'}),db=getFirestore(app);
const status=document.getElementById('status'),list=document.getElementById('list');
try{const snap=await getDocs(query(collection(db,'managedDocuments'),where('status','==','published'),limit(100)));for(const item of snap.docs){const d=item.data();if(d.status!=='published')continue;const article=document.createElement('article'),heading=document.createElement('h2'),cat=document.createElement('p'),desc=document.createElement('p');heading.textContent=d.title||'';cat.textContent=d.category||'';desc.textContent=d.description||'';article.append(heading,cat,desc);if(typeof d.url==='string'&&/^https:\/\//i.test(d.url)){const link=document.createElement('a');link.href=d.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='เปิดเอกสาร';article.append(link)}list.append(article)}status.textContent='เอกสารเผยแพร่ '+snap.size+' รายการ (สูงสุด 100 รายการแรก)'}catch(e){status.textContent='ไม่สามารถโหลดเอกสารได้ กรุณาตรวจสอบ Firestore Rules ('+(e.code||'unknown')+')'}
</script></body></html>
